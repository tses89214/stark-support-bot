<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stark Spaceships Support</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --card:#f2f3f5; --me:#2f5bea; --muted:#6b7280; --line:#d9dce1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#e8e9eb; --card:#23262c; --me:#4a74f5; --muted:#9aa0aa; --line:#33373f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  body > div { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:3fr 2fr; gap:16px; padding:0 16px; }
  @media (max-width:760px) { body > div { grid-template-columns:1fr; } aside { max-height:30vh; } }
  main { padding:16px 0; display:flex; flex-direction:column; height:100vh; box-sizing:border-box; min-width:0; }
  aside { padding:16px 0; height:100vh; box-sizing:border-box; overflow-y:auto; }
  aside h2 { font-size:14px; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .doc { background:var(--card); border-radius:8px; padding:6px 12px; margin-bottom:6px; font-size:13px; white-space:pre-wrap; }
  .doc summary { cursor:pointer; font-weight:600; }
  .doc[open] summary { margin-bottom:4px; }
  h1 { font-size:18px; margin:0 0 12px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; background:var(--card); white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { align-self:flex-end; background:var(--me); color:#fff; }
  .md { white-space:normal; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md h3, .md h4 { margin:.5em 0; }
  .md ul, .md ol { padding-left:1.4em; }
  .md h3, .md h4 { font-size:1em; }
  .md code { font:.9em ui-monospace, monospace; background:rgba(127,127,127,.2); padding:1px 4px; border-radius:4px; }
  .md pre { background:rgba(127,127,127,.2); padding:8px; border-radius:6px; overflow-x:auto; white-space:pre; }
  .md pre code { background:none; padding:0; }
  .md table { border-collapse:collapse; font-size:.9em; display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--line); padding:3px 8px; }
  .md hr { border:0; border-top:1px solid var(--line); }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  form { display:flex; gap:8px; margin-top:12px; }
  textarea { flex:1; resize:none; max-height:40vh; padding:10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  button { padding:10px 16px; font:inherit; border:0; border-radius:8px; background:var(--me); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  #modes { display:flex; flex-wrap:wrap; gap:12px; margin:0 0 12px; font-size:13px; color:var(--muted); }
  #modes button { padding:4px 10px; font-size:13px; background:var(--card); color:var(--fg); border:1px solid var(--line); margin-left:auto; }
  #modes select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
</style>
</head>
<body>
<div>
<main>
  <h1>🚀 Stark Spaceships Support</h1>
  <div id="modes">
    <label>Defense <select id="defense">
      <option value="L0">L0 no defenses</option>
      <option value="L1">L1 + answer rules</option>
      <option value="L2">L2 + input fence</option>
      <option value="L3">L3 + classifier</option>
      <option value="L4" selected>L4 + retrieval + review (real bot)</option>
    </select></label>
    <label>Retrieval <select id="retrieval">
      <option value="R0">R0 all documents</option>
      <option value="R1">R1 top-3 embedding</option>
      <option value="R2" selected>R2 scope check + top-3</option>
      <option value="R3">R3 LLM reads index</option>
    </select></label>
    <button type="button" id="newchat" title="Forget this conversation and start over">↻ New chat</button>
  </div>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask about our spaceships… (Shift+Enter for a new line)" autofocus></textarea>
    <button>Send</button>
  </form>
</main>
<aside>
  <h2>📄 Source documents (what the answer should be based on)</h2>
  <div id="docs"><p class="meta">Documents used for each answer appear here.</p></div>
  <h2>🧭 Conversation focus (what the bot thinks this chat is about)</h2>
  <div id="focus" class="meta">Nothing yet.</div>
</aside>
</div>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"), form = document.getElementById("form");
let session = crypto.randomUUID();  // one per chat: the server keeps the history under it, and MLflow groups the traces by it
const defense = document.getElementById("defense"), retrieval = document.getElementById("retrieval");

// New chat: a fresh session id, an empty log. Also used when defense / retrieval change, so one level never sees another's turns.
function reset() {  // another level is a different bot: old turns would leak the previous one's answers into this one
  session = crypto.randomUUID();  // a new id is a new server-side conversation
  log.replaceChildren();
  showDocs({});
  showFocus(null);
  retrieval.disabled = defense.value !== "L4";  // L0-L3 always read every document
}
defense.addEventListener("change", reset);
document.getElementById("newchat").addEventListener("click", () => { reset(); input.focus(); });
retrieval.addEventListener("change", reset);

// Small markdown subset for model replies: headings, lists, tables, code, bold/italic, links. HTML is escaped first, so a reply cannot inject markup.
// Block by block: fenced code, lists, tables, headings, rules, then paragraphs; `inline` handles bold/italic/code/links inside a block.
function md(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim().startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith("```"); i++) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if (/^\s*[-*]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)) {
      const tag = /^\s*\d/.test(l) ? "ol" : "ul", items = [];
      for (; i < lines.length && /^\s*([-*]|\d+[.)])\s+/.test(lines[i]); i++) items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+[.)])\s+/, ""))}</li>`);
      i--;
      out.push(`<${tag}>${items.join("")}</${tag}>`);
    } else if (/^\s*\|.*\|\s*$/.test(l)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(lines[i].trim().slice(1, -1).split("|").map((c) => c.trim()));
      i--;
      const body = rows.filter((r) => !r.every((c) => /^:?-{2,}:?$/.test(c)));
      out.push("<table>" + body.map((r, n) => "<tr>" + r.map((c) => `<${n ? "td" : "th"}>${inline(c)}</${n ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>");
    } else if (/^#{1,6}\s/.test(l)) {
      out.push(`<h3>${inline(l.replace(/^#+\s*/, ""))}</h3>`);
    } else if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) {
      out.push("<hr>");
    } else if (l.trim()) {
      const para = [];
      for (; i < lines.length && lines[i].trim() && !/^\s*([-*]|\d+[.)])\s+|^\s*\||^#{1,6}\s|^\s*```/.test(lines[i]); i++) para.push(inline(lines[i]));
      i--;
      out.push(`<p>${para.join("<br>")}</p>`);
    }
  }
  return out.join("");
}

// Append a chat bubble. `meta` (the route/sources line) is only passed for bot replies, which are the ones rendered as markdown.
function add(text, cls, meta) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (cls === "bot" && meta) { div.classList.add("md"); div.innerHTML = md(text); } else div.textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; div.append(m); }
  log.append(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

// Right-hand panel, second block: the server's Focus after the last turn.
function showFocus(f) {
  const parts = [f && f.talking_about.length && "talking about " + f.talking_about.join(", "), f && f.interested_in && "interested in " + f.interested_in, f && f.goal && "goal: " + f.goal];
  document.getElementById("focus").textContent = parts.filter(Boolean).join(" · ") || "Nothing yet.";
}

// Right-hand panel: the documents the last answer was based on (name -> full text).
function showDocs(docs) {
  const box = document.getElementById("docs");
  box.replaceChildren();
  for (const [name, text] of Object.entries(docs || {})) {
    const d = document.createElement("details");  // native fold: one per document, closed until clicked
    d.className = "doc";
    const t = document.createElement("summary");
    t.textContent = name;
    d.append(t, text);
    box.append(d);
  }
  if (!box.children.length) box.innerHTML = '<p class="meta">No documents used for this reply.</p>';
}

reset();

// Enter sends, Shift+Enter newline (not while an IME is composing); the box grows with its text.
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
const grow = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + 2 + "px"; };
input.addEventListener("input", grow);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || form.querySelector("button").disabled) return;  // Enter (requestSubmit) ignores a disabled button: without this, a second message goes out before the first is answered
  input.value = "";
  grow();
  add(message, "me");
  const wait = add("…", "bot");
  form.querySelector("button").disabled = true;
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message, session, defense: defense.value, retrieval: retrieval.value }) });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    wait.remove();
    showDocs(data.docs);
    showFocus(data.focus);
    add(data.reply, "bot", `route: ${data.route}` + (data.sources.length ? ` · sources: ${data.sources.join(", ")}` : ""));
  } catch (err) {
    wait.textContent = "Something went wrong. Please try again.";
  }
  form.querySelector("button").disabled = false;
  input.focus();
});
</script>
</body>
</html>
