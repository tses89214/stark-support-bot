<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stark Spaceships Support</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --card:#f2f3f5; --me:#2f5bea; --muted:#6b7280; --line:#d9dce1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#e8e9eb; --card:#23262c; --me:#4a74f5; --muted:#9aa0aa; --line:#33373f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100vh; box-sizing:border-box; }
  h1 { font-size:18px; margin:0 0 12px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; background:var(--card); white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--me); color:#fff; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; padding:10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  button { padding:10px 16px; font:inherit; border:0; border-radius:8px; background:var(--me); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<main>
  <h1>🚀 Stark Spaceships Support</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Ask about our spaceships…" autocomplete="off" autofocus>
    <button>Send</button>
  </form>
</main>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"), form = document.getElementById("form");
let history = [];

function add(text, cls, meta) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; div.append(m); }
  log.append(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  add(message, "me");
  const wait = add("…", "bot");
  form.querySelector("button").disabled = true;
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message, history }) });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    history = data.history;
    wait.remove();
    add(data.reply, "bot", `route: ${data.route}` + (data.sources.length ? ` · sources: ${data.sources.join(", ")}` : ""));
  } catch (err) {
    wait.textContent = "Something went wrong. Please try again.";
  }
  form.querySelector("button").disabled = false;
  input.focus();
});
</script>
</body>
</html>
